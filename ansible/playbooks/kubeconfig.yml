---
# Downloads an admin kubeconfig pointing at https://127.0.0.1:6443
# (reach it with `make tunnel`, which opens an SSM port-forwarding session).
- name: Fetch the cluster kubeconfig
  hosts: k8s_control_plane
  gather_facts: false
  tasks:
    - name: Read admin.conf
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Write ../.kube/skyforge.yaml
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../.kube/skyforge.yaml"
        content: >-
          {{ admin_conf.content | b64decode
             | regex_replace('server: https://[^\n]+', 'server: https://127.0.0.1:6443') }}
        mode: "0600"
      delegate_to: localhost
      become: false
