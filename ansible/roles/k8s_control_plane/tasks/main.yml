---
- name: Detect the installed kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_version
  changed_when: false

- name: Render the kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"

- name: Initialize the control plane
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directories
  ansible.builtin.file:
    path: "{{ item.home }}/.kube"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0700"
  loop:
    - { user: root, home: /root }
    - { user: ubuntu, home: /home/ubuntu }
  loop_control:
    label: "{{ item.user }}"

- name: Copy kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ item.home }}/.kube/config"
    remote_src: true
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0600"
  loop:
    - { user: root, home: /root }
    - { user: ubuntu, home: /home/ubuntu }
  loop_control:
    label: "{{ item.user }}"

- name: Install the Calico CNI (enforces NetworkPolicies)
  ansible.builtin.command: >-
    kubectl apply --server-side --force-conflicts
    -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
  args:
    creates: /etc/cni/net.d/10-calico.conflist
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Wait for the control plane node to be Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Create a join command for the workers
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
  register: join_command
  changed_when: false

- name: Expose the join command to the worker play
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_command.stdout }}"
  no_log: true
