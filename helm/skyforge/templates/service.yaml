apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "skyforge.name" . }}
  labels:
    {{- include "skyforge.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skyforge.name" . }}
  labels:
    {{- include "skyforge.labels" . | nindent 4 }}
    {{- include "skyforge.app.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "skyforge.app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
