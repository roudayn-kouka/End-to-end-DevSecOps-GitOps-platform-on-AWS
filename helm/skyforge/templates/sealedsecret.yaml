{{- with .Values.database.sealedSecret.encryptedData }}
# Encrypted with the cluster's Sealed Secrets public key: safe to commit to Git,
# only the controller inside the cluster can decrypt it.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $.Values.database.secretName }}
  labels:
    {{- include "skyforge.labels" $ | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: {{ $.Values.database.secretName }}
      labels:
        {{- include "skyforge.labels" $ | nindent 8 }}
{{- end }}
