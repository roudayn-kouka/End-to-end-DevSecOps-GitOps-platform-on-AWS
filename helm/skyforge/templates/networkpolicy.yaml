{{- if .Values.networkPolicy.enabled }}
# Zero-trust baseline: deny all inbound traffic in the namespace, then allow only
#   ingress controller -> api:5000, prometheus -> api:5000, api -> postgres:5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "skyforge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "skyforge.name" . }}-api
  labels:
    {{- include "skyforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "skyforge.app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: 5000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "skyforge.name" . }}-postgres
  labels:
    {{- include "skyforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "skyforge.db.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "skyforge.app.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
