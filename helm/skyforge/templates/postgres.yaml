{{- $pg := .Values.database.postgres -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skyforge.db.host" . }}
  labels:
    {{- include "skyforge.labels" . | nindent 4 }}
    {{- include "skyforge.db.selectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "skyforge.db.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "skyforge.db.host" . }}
  labels:
    {{- include "skyforge.labels" . | nindent 4 }}
    {{- include "skyforge.db.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "skyforge.db.host" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "skyforge.db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skyforge.labels" . | nindent 8 }}
        {{- include "skyforge.db.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "skyforge.podSecurityContext" . | nindent 8 }}
        runAsUser: 70  # postgres user of the alpine image
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ $pg.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          securityContext:
            {{- include "skyforge.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.storage }}
