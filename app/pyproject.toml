[project]
name = "skyforge"
version = "1.0.0"
description = "SkyForge Tasks - demo workload for the SkyForge GitOps platform"
authors = [{ name = "Roudayna Kouka" }]
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S104"]  # binding to 0.0.0.0 is expected inside a container

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=skyforge --cov-report=term-missing --cov-fail-under=90"
