# SealedSecrets used by the monitoring stack (Grafana admin, Alertmanager Slack webhook).
# Generated by scripts/seal-secrets.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/__GITHUB_USER__/skyforge.git
    targetRevision: main
    path: argocd/platform/monitoring-secrets
    directory:
      exclude: "*.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
